<svg width="750" height="350" viewBox="0 0 750 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="750" height="350" fill="#A8C5C9"/>
  
  <!-- Hand/Arm -->
  <path d="M 50 200 Q 200 180 350 175 L 350 250 Q 200 240 50 260 Z" fill="#FFD4A3"/>
  
  <!-- Sleeve -->
  <rect x="0" y="180" width="150" height="100" fill="#3C3C3C"/>
  <circle cx="40" cy="220" r="12" fill="#F5F5F5"/>
  <circle cx="40" cy="250" r="12" fill="#F5F5F5"/>
  
  <!-- Watch strap top -->
  <rect x="300" y="140" width="100" height="70" rx="8" fill="#2C2C2C"/>
  
  <!-- Watch face -->
  <circle cx="350" cy="175" r="60" fill="#2C2C2C"/>
  <circle cx="350" cy="175" r="55" fill="#F5F5F5"/>
  
  <!-- Clock markers -->
  <circle cx="350" cy="130" r="4" fill="#2C2C2C"/>
  <circle cx="395" cy="175" r="4" fill="#2C2C2C"/>
  <circle cx="350" cy="220" r="4" fill="#2C2C2C"/>
  <circle cx="305" cy="175" r="4" fill="#2C2C2C"/>
  
  <!-- Clock hands -->
  <line x1="350" y1="175" x2="350" y2="140" stroke="#2C2C2C" stroke-width="3" stroke-linecap="round"/>
  <line x1="350" y1="175" x2="380" y2="195" stroke="#E74C3C" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Watch strap bottom -->
  <rect x="300" y="210" width="100" height="70" rx="8" fill="#2C2C2C"/>
</svg>